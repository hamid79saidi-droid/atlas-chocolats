<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas chocolate</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff5e9;
      text-align: center;
      margin: 0;
    }

    header {
      background: #4b2418;
      color: white;
      padding: 25px;
    }

    h1 {
      margin: 0;
    }

    .products {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 30px;
    }

    .product {
      background: white;
      width: 220px;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 3px 10px #0002;
    }

    .product img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
    }

    button {
      background: #6b3524;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #a05a35;
    }

    footer {
      background: #4b2418;
      color: white;
      padding: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🍫 Sweet Chocolate Shop</h1>
    <p>Discover your favorite chocolates!</p>
  </header>

  <h2>Our Chocolates</h2>

  <div class="products">

    <div class="product">
      <img src="https://images.unsplash.com/photo-1548907040-4d42cfc7f2c5?w=400"
           alt="Chocolate pieces">
      <h3>Milk Chocolate</h3>
      <p>Price: 30 MAD</p>
      <button onclick="addToCart('Milk Chocolate')">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1511381939415-e44015466834?w=400"
           alt="Dark chocolate">
      <h3>Dark Chocolate</h3>
      <p>Price: 40 MAD</p>
      <button onclick="addToCart('Dark Chocolate')">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1575377427642-087cf684f29d?w=400"
           alt="Chocolate pralines">
      <h3>Chocolate Pralines</h3>
      <p>Price: 50 MAD</p>
      <button onclick="addToCart('Chocolate Pralines')">Add to Cart</button>
    </div>

  </div>

  <h2>🛒 Your Cart: <span id="count">0</span></h2>
  <p id="message">Your cart is empty.</p>

  <footer>
    <p>© 2026 Sweet Chocolate Shop</p>
  </footer>

  <script>
    let cart = [];

    function addToCart(product) {
      cart.push(product);

      document.getElementById("count").textContent = cart.length;
      document.getElementById("message").textContent =
        "Added: " + cart.join(", ");
    }
  </script>

</body>
</html>
